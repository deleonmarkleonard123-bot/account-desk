services:
  - type: web
    name: account-desk
    runtime: node
    plan: free
    rootDir: mlad-node-project
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: APP_BASE_URL
        sync: false
      - key: DB_BACKEND
        value: postgres
      - key: AUTH_BACKEND
        value: supabase
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_CA
        value: /etc/secrets/supabase-ca.crt
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TRUST_PROXY
        value: "true"